<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ELLASTORE - Game Top-up{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page_id %}{% endblock %}">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ url_for('pages.home') }}">ELLA<span>STORE</span></a>

    <form class="search" action="{{ url_for('pages.home') }}" method="get" role="search">
      <input id="searchInput" name="q" type="search" value="{{ query or '' }}"
             placeholder="Search games..." aria-label="Search games">
    </form>

    <nav class="nav" aria-label="Games">
      {%- for g in nav_games %}
      <a href="{{ url_for('pages.topup', game_id=g.id) }}"
         class="{{ 'is-active' if request.view_args and request.view_args.get('game_id') == g.id else '' }}">{{ g.name }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <p class="footer-brand">{{ store.name }} &middot; {{ store.tagline }}</p>
      <p class="footer-note">{{ store.blurb }} Secure payment.<br>&copy; {{ store.year }} {{ store.name }}.</p>
    </div>
    <form class="subscribe" data-subscribe>
      <input name="email" type="email" required placeholder="Enter your email" aria-label="Email">
      <button type="submit">Subscribe</button>
    </form>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
