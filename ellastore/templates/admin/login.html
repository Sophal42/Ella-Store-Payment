<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; ELLASTORE Admin</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 22rem; margin: 5rem auto; padding: 0 1rem; color: #1f2233; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; font-size: .9rem; }
  input { width: 100%; box-sizing: border-box; padding: .55rem .7rem; margin-top: .3rem; border: 1px solid #d1d5db; border-radius: .5rem; font: inherit; }
  button { width: 100%; margin-top: 1.4rem; padding: .65rem; border: 0; border-radius: .5rem; background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .flash { color: #b91c1c; font-weight: 600; }
  footer { margin-top: 1.5rem; font-size: .85rem; color: #6b7280; }
</style>
</head>
<body>
  <h1>ELLASTORE Admin</h1>
  {%- for category, message in get_flashed_messages(with_categories=true) %}
  <p class="flash">{{ message }}</p>
  {%- endfor %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <footer><a href="/">Back to store</a></footer>
</body>
</html>
